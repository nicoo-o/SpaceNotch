name: CI

# La construction cible Windows, donc l'agent doit être Windows : les cibles WinUI
# et les projections WinRT ne se restaurent pas ailleurs.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Construction et tests
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # La version est lue depuis global.json plutôt que répétée ici, où elle
      # finirait par diverger de ce que la machine de développement utilise.
      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # La restauration porte la plateforme, et la construction ne s'en prive pas
      # non plus — c'est ce dernier point qui compte.
      #
      # Cette étape a d'abord été écrite avec `--no-restore` sur les constructions
      # suivantes, pour économiser quelques secondes. Elle a échoué sur l'agent en
      # NETSDK1112 : le fichier de composants écrit par la restauration ne
      # contenait pas la cible win-x64 que la construction réclamait, parce que
      # l'identifiant d'exécution y est déduit de l'architecture du processus qui
      # évalue le projet — et cette évaluation n'a pas donné le même résultat dans
      # les deux commandes. Une commande qui se restaure elle-même ne peut pas
      # diverger d'elle-même : la redondance coûte quelques secondes, la
      # divergence coûtait la construction.
      - name: Restaurer
        run: dotnet restore -p:Platform=x64 -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true

      # Release porte TreatWarningsAsErrors : cette étape échoue donc sur le
      # moindre avertissement. C'est délibéré — c'est la construction de référence.
      - name: Construire en Release
        run: dotnet build -c Release -p:Platform=x64

      - name: Construire en Debug
        run: dotnet build -c Debug -p:Platform=x64

      # Les tests du cœur s'exécutent sans machine graphique : SpaceNotch.Core ne
      # référence aucune bibliothèque Windows.
      - name: Auditer les dépendances NuGet
        run: dotnet list SpaceNotch.sln package --vulnerable --include-transitive --no-restore

      - name: Tester en Release
        run: dotnet test -c Release --logger "trx;LogFileName=resultats.trx"

      - name: Publier les résultats de test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultats-tests
          path: '**/resultats.trx'
          if-no-files-found: warn

      # Distribution portable : c'est la voie qui fonctionne sans certificat, et
      # donc celle que la CI produit systématiquement. EnableMsixTooling nomme le
      # fichier de ressources resources.pri, sans quoi l'application publiée
      # plante au démarrage (WindowsAppSDK#3718) — même non empaquetée. Le .exe
      # distribuable vient du workflow « Release ».
      - name: Publier l'exécutable portable
        run: >
          dotnet publish src/SpaceNotch.App/SpaceNotch.App.csproj
          -c Release -p:Platform=x64
          -p:EnableMsixTooling=true
          --output "${{ runner.temp }}/spacenotch"

      - name: Conserver l'exécutable portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spacenotch-portable-x64
          path: ${{ runner.temp }}/spacenotch
          if-no-files-found: error

  # n° 51 : l'installeur ne réécrit plus l'exécutable installé. Les deux variantes
  # (téléchargée, identité éteinte ; installée, identité allumée) sont construites
  # et signées ici par un certificat de test éphémère — la vraie signature viendra
  # de SignPath —, puis l'installée est refaite comme le fera l'installeur, et sa
  # signature Authenticode doit être valide.
  variants:
    name: Variantes de l'exécutable
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Publier l'exécutable unique
        run: >
          dotnet publish src/SpaceNotch.App/SpaceNotch.App.csproj
          -c Release -p:Platform=x64 -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output "${{ runner.temp }}/single"

      - name: Construire et signer les deux variantes
        shell: pwsh
        run: |
          . ./tools/release/Variant.ps1
          $dir = "${{ runner.temp }}/variants"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Get-ChildItem "${{ runner.temp }}/single" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "$dir/telechargee.exe"
          Copy-Item $exe.FullName "$dir/installee.exe"
          Set-IdentityManifest "$dir/telechargee.exe" $false
          Set-IdentityManifest "$dir/installee.exe" $true

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64" -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "signtool.exe") } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "SignTool introuvable (Windows SDK)." }

          # Certificat de test : approuvé sur cette machine jetable seulement, pour
          # qu'Authenticode dise « Valid » ou « HashMismatch », rien d'autre.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=SpaceNotch CI (test)" -CertStoreLocation Cert:\CurrentUser\My
          Export-Certificate -Cert $cert -FilePath "${{ runner.temp }}/test.cer" | Out-Null
          Import-Certificate -FilePath "${{ runner.temp }}/test.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          & "$($sdk.FullName)\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint "$dir/telechargee.exe" "$dir/installee.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signature de test impossible ($LASTEXITCODE)." }

          Export-VariantSignature "$dir/installee.exe" "$dir/SpaceNotch-identity.bin"
          Get-ChildItem $dir | ForEach-Object { "{0,-26} {1,12:N0} octets" -f $_.Name, $_.Length }

      - name: Refaire la variante installée
        env:
          SPACENOTCH_VARIANTS: ${{ runner.temp }}/variants
        run: dotnet test tests/SpaceNotch.Core.Tests -c Release -p:Platform=x64 --filter "FullyQualifiedName~InstalledVariantTests"

      - name: Vérifier les signatures
        shell: pwsh
        run: |
          $dir = "${{ runner.temp }}/variants"
          foreach ($name in "telechargee.exe", "installee.exe", "refaite.exe") {
            $signature = Get-AuthenticodeSignature "$dir/$name"
            "{0,-16} {1}" -f $name, $signature.Status
            if ($signature.Status -ne "Valid") { throw "$name : signature $($signature.Status)." }
          }
          if ((Get-FileHash "$dir/refaite.exe").Hash -ne (Get-FileHash "$dir/installee.exe").Hash) { throw "La variante refaite diffère de l'installée." }
          Write-Host "La variante installée, refaite par l'installeur, est identique à celle signée par la CI."

  package-msix:
    name: Empaquetage MSIX
    runs-on: windows-latest
    needs: build-and-test

    # Il faut un certificat pour signer un MSIX, et ce certificat n'a rien à faire
    # dans le dépôt. Sans ce secret, l'étape est franchement ignorée plutôt que
    # d'échouer sur un paquet non signé, qui ne serait de toute façon pas
    # installable.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      CERTIFICAT_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
      # Le mot de passe passe par l'environnement, jamais par la ligne de
      # commande : un argument est visible dans la liste des processus de la
      # machine, une variable d'environnement ne l'est pas.
      CERTIFICAT_MOT_DE_PASSE: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}

    steps:
      - name: Vérifier la disponibilité du certificat
        id: cert
        shell: bash
        run: |
          if [ -z "$CERTIFICAT_BASE64" ]; then
            echo "::notice::Aucun certificat MSIX configuré : empaquetage ignoré. Fournir le secret MSIX_CERTIFICATE_BASE64 pour l'activer."
            echo "disponible=false" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le dépôt
        if: steps.cert.outputs.disponible == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer le SDK .NET
        if: steps.cert.outputs.disponible == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restaurer
        if: steps.cert.outputs.disponible == 'true'
        run: dotnet restore -p:Platform=x64

      # L'empaquetage exige la chaîne MSIX, désactivée par défaut parce que la
      # distribution portable n'en a pas besoin. Elle est activée ici uniquement.
      - name: Produire le paquet signé
        if: steps.cert.outputs.disponible == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "$CERTIFICAT_BASE64" | base64 -d > certificat.pfx

          dotnet publish src/SpaceNotch.App/SpaceNotch.App.csproj \
            -c Release -p:Platform=x64 \
            -p:EnableMsixTooling=true \
            -p:WindowsPackageType=MSIX \
            -p:GenerateAppxPackageOnBuild=true \
            -p:AppxPackageSigningEnabled=true \
            -p:PackageCertificateKeyFile=certificat.pfx \
            -p:PackageCertificatePassword="$CERTIFICAT_MOT_DE_PASSE" \
            -p:AppxPackageDir="${{ runner.temp }}/msix/" \
            --output "${{ runner.temp }}/msix-publish"

          rm -f certificat.pfx

      - name: Conserver le paquet
        if: steps.cert.outputs.disponible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spacenotch-msix-x64
          path: ${{ runner.temp }}/msix
          if-no-files-found: error
