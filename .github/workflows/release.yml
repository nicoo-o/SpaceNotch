name: Release

# Produit SpaceNotch pour Windows, en trois formes :
#   - SpaceNotch-Setup.exe, l'installeur, sans identité de paquet : il peut donc
#     démarrer même quand une version de SpaceNotch est déjà installée ;
#   - SpaceNotch.exe, l'application autonome, avec identité de paquet pour les
#     notifications Windows — à garder à côté du Setup lors du téléchargement ;
#   - SpaceNotch-win-x64.zip, le dossier complet (démarrage un peu plus rapide).
#
# Deux déclencheurs :
#   - le bouton « Run workflow » de l'onglet Actions : les fichiers arrivent dans les
#     « Artifacts » de l'exécution ;
#   - un tag de version (v1.0.0…) : une Release GitHub est créée avec les fichiers attachés.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version inscrit dans l'exécutable (ex. 1.0.0)"
        required: false
        default: "1.1.0"
      publish:
        description: "Publier une Release GitHub (crée le tag v<version> sur ce commit)"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: src/SpaceNotch.App/SpaceNotch.App.csproj

jobs:
  build:
    name: Construire SpaceNotch (win-x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # La version vient du tag (v1.2.3 → 1.2.3) ou du champ du bouton manuel.
      - name: Déterminer la version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ github.event.inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.0" }
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $version"

      # Les tests passent avant toute publication : un .exe qui sortirait d'un cœur
      # cassé ne mérite pas d'être distribué.
      - name: Restaurer avec audit NuGet
        run: dotnet restore SpaceNotch.sln -p:Platform=x64 -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true

      - name: Auditer les dépendances NuGet
        run: dotnet list SpaceNotch.sln package --vulnerable --include-transitive --no-restore

      - name: Tester toute la solution en Release
        run: dotnet test SpaceNotch.sln -c Release --no-restore

      # Application installable. Les réglages viennent de Microsoft pour une application
      # WinUI 3 non empaquetée :
      #   - WindowsAppSDKSelfContained + SelfContained : aucun runtime à installer ;
      #   - EnableMsixTooling=true : sans lui, le fichier de ressources n'est pas
      #     renommé en resources.pri et l'application publiée plante au démarrage
      #     (WindowsAppSDK#3718) — même pour une application non empaquetée ;
      #   - IncludeAllContentForSelfExtract + IncludeNativeLibrariesForSelfExtract :
      #     les ressources et les bibliothèques natives vont dans l'exécutable et sont
      #     extraites au premier lancement ;
      #   - EnableCompressionInSingleFile : le contenu est compressé dans l'exécutable,
      #     qui pèse bien moins lourd à télécharger. Il est de toute façon extrait au
      #     premier lancement : la décompression ne coûte qu'une fois.
      # Paquet d'identité (ADR-023) : le manifeste de packaging/identity, à la version
      # publiée, empaqueté par MakeAppx puis signé par un certificat éphémère créé ici.
      # La clé privée est détruite aussitôt après la signature et ne quitte jamais
      # cette machine : seul le certificat public (.cer) voyage avec l'installeur.
      - name: Paquet d'identité
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64" -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "makeappx.exe") } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "MakeAppx introuvable (Windows SDK)." }

          $work = "${{ runner.temp }}/identity"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item packaging/identity/* $work -Recurse -Force
          $manifest = Join-Path $work "AppxManifest.xml"
          (Get-Content $manifest -Raw).Replace("__VERSION__", "${{ steps.version.outputs.value }}.0") | Set-Content $manifest -Encoding utf8

          $out = "artifacts/identity"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "$($sdk.FullName)\makeappx.exe" pack /d $work /p "$out/SpaceNotch.Identity.msix" /nv /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx a échoué ($LASTEXITCODE)." }

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=SpaceNotch" -KeyUsage DigitalSignature `
            -FriendlyName "SpaceNotch (paquet d'identité)" -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(5) -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $secret = [guid]::NewGuid().ToString()
          $pfx = "${{ runner.temp }}/identity.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $secret -AsPlainText -Force) | Out-Null
          & "$($sdk.FullName)\signtool.exe" sign /fd SHA256 /f $pfx /p $secret "$out/SpaceNotch.Identity.msix"
          $signed = $LASTEXITCODE
          Export-Certificate -Cert $cert -FilePath "$out/SpaceNotch.Identity.cer" | Out-Null

          # La clé privée disparaît : le fichier .pfx et le certificat du magasin.
          Remove-Item $pfx -Force
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          if ($signed -ne 0) { throw "Signature du paquet d'identité impossible ($signed)." }

          Get-ChildItem $out | ForEach-Object { "{0} {1:N0} octets" -f $_.Name, $_.Length }
          Write-Host "Certificat éphémère : $($cert.Thumbprint) (clé privée détruite)"

          # L'empreinte est inscrite dans l'exécutable : l'installeur élevé n'approuve
          # que ce certificat.
          "IDENTITY_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publier l'exécutable unique
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -p:Platform=x64 -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.value }}
          -p:IdentityThumbprint=${{ env.IDENTITY_THUMBPRINT }}
          --output "${{ runner.temp }}/single"

      # Installeur distinct : même interface et même empreinte approuvée, mais sans
      # le manifeste MSIX de l'application. Sans ce manifeste, Windows ne bloque pas
      # le lancement du Setup quand SpaceNotch.Identity est déjà enregistré.
      - name: Publier l'installeur sans identité
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -p:Platform=x64 -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=true
          -p:SetupBuild=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.value }}
          -p:IdentityThumbprint=${{ env.IDENTITY_THUMBPRINT }}
          --output "${{ runner.temp }}/setup"

      - name: Publier le dossier complet
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -p:Platform=x64 -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.value }}
          -p:IdentityThumbprint=${{ env.IDENTITY_THUMBPRINT }}
          --output "${{ runner.temp }}/folder"

      - name: Rassembler les fichiers
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}/dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Get-ChildItem "${{ runner.temp }}/single" -Filter "*.exe" | Select-Object -First 1
          $setup = Get-ChildItem "${{ runner.temp }}/setup" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Aucun exécutable produit pour SpaceNotch." }
          if (-not $setup) { throw "Aucun exécutable produit pour le Setup." }
          if ($exe.Name -eq $setup.Name) { throw "Le Setup et SpaceNotch doivent porter des noms distincts." }
          if ((Get-FileHash $exe.FullName).Hash -eq (Get-FileHash $setup.FullName).Hash) { throw "Le Setup doit être un exécutable distinct de SpaceNotch.exe." }
          Copy-Item $exe.FullName "$out/SpaceNotch.exe"
          Copy-Item $setup.FullName "$out/SpaceNotch-Setup.exe"

          Compress-Archive -Path "${{ runner.temp }}/folder/*" -DestinationPath "$out/SpaceNotch-win-x64.zip" -Force

          Get-ChildItem $out | ForEach-Object { "{0,-28} {1,8:N1} Mo" -f $_.Name, ($_.Length / 1MB) }

          # Sans resources.pri, aucune fenêtre XAML ne se charge (WindowsAppSDK#6720).
          if (-not (Test-Path "${{ runner.temp }}/folder/resources.pri")) { throw "resources.pri absent de la publication." }
          if (-not (Test-Path (Join-Path "${{ runner.temp }}/setup" "SpaceNotch.App.pri"))) { throw "Le Setup multi-fichier ne contient pas SpaceNotch.App.pri." }
          if (-not (Test-Path (Join-Path "${{ runner.temp }}/setup" "SpaceNotch.Identity.msix"))) { throw "SpaceNotch.Identity.msix absent du Setup." }

      - name: Générer les empreintes SHA-256
        shell: pwsh
        run: |
          $dist = "${{ runner.temp }}/dist"
          Get-ChildItem $dist -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), [IO.Path]::GetFileName($_.Path) } |
            Set-Content "$dist/SHA256SUMS.txt" -Encoding ascii

      # Essai de démarrage : l'application est lancée en mode démonstration ; la
      # notch doit s'être réellement ouverte et tourner encore après quelques secondes.
      # « Le processus tourne » ne suffit pas : la v1.0.0 tournait sans aucune fenêtre,
      # chaque XAML échouant faute de resources.pri. Bloquant : une version qui
      # n'affiche rien ne doit jamais être publiée.
      - name: Essai de démarrage
        id: smoke
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "SpaceNotch\\logs\\spacenotch.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          try {
            $process = Start-Process -FilePath "${{ runner.temp }}/dist/SpaceNotch.exe" -ArgumentList "--demo" -PassThru
          } catch {
            # Un manifeste refusé (« side-by-side ») : Windows en dit la raison exacte
            # dans le journal SideBySide — attribut, ligne, valeur.
            Write-Host "----- journal SideBySide -----"
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; ProviderName = "SideBySide" } -MaxEvents 5 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.TimeCreated; Write-Host $_.Message }
            throw "SpaceNotch.exe n'a pas pu démarrer : $($_.Exception.Message)"
          }
          Start-Sleep -Seconds 12
          $alive = -not $process.HasExited
          if ($alive) { Stop-Process -Id $process.Id -Force }
          Start-Sleep -Seconds 1
          $journal = if (Test-Path $log) { Get-Content $log -Raw } else { "" }

          # Un processus vivant ne suffit pas : l'Island doit s'être ouverte.
          # Une fenêtre qui échoue au chargement laisse un [FATAL] au journal.
          if (-not $alive -or $journal -match "\[FATAL\]" -or $journal -notmatch "window activated") {
            Write-Host $journal
            throw "La notch ne s'est pas ouverte au démarrage."
          }
          Write-Host "La notch s'est ouverte et tourne toujours après 12 s."

      # Essai de l'installeur avec sa fenêtre sur une machine propre : c'est ce que
      # lance un double-clic. La fenêtre doit rester ouverte sans rien installer.
      - name: Essai de l'installeur (fenêtre)
        shell: pwsh
        run: |
          $setup = "${{ runner.temp }}/dist/SpaceNotch-Setup.exe"
          $log = Join-Path $env:LOCALAPPDATA "SpaceNotch\logs\spacenotch.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $setup -PassThru
          Start-Sleep -Seconds 12
          $alive = -not $process.HasExited
          if ($alive) { Stop-Process -Id $process.Id -Force }
          Start-Sleep -Seconds 1
          $journal = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          Write-Host "----- journal -----"
          Write-Host $journal

          if (-not $alive -or $journal -match "\[FATAL\]" -or $journal -notmatch "Installeur ouvert") {
            Write-Host "----- journal d'événements -----"
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @(".NET Runtime", "Application Error", "Windows Error Reporting") } |
              ForEach-Object { $_.Message } | Select-Object -First 6
            throw "L'installeur s'est fermé au démarrage (code $($process.ExitCode))."
          }
          Write-Host "La fenêtre de l'installeur est toujours ouverte après 12 s."

      # Essai de l'installeur avec l'application livrée à côté : installer, vérifier
      # fichiers/raccourcis/entrée, relancer le Setup avec l'identité présente,
      # démarrer SpaceNotch puis désinstaller. Une régression ne doit jamais être publiée.
      - name: Essai de l'installeur
        shell: pwsh
        run: |
          $setup = "${{ runner.temp }}/dist/SpaceNotch-Setup.exe"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\SpaceNotch"
          $exe = Join-Path $dir "SpaceNotch.exe"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SpaceNotch"
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "SpaceNotch.lnk"
          $desktop = Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "SpaceNotch.lnk"

          $install = Start-Process -FilePath $setup -ArgumentList "--quiet","--startup=on","--desktop=on" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installation silencieuse : code $($install.ExitCode)." }
          if (-not (Test-Path $exe)) { throw "SpaceNotch.exe absent de $dir." }
          if (-not (Test-Path $menu)) { throw "Raccourci du menu Démarrer absent." }
          if (-not (Test-Path $desktop)) { throw "Raccourci du bureau absent." }

          # Identité de paquet : enregistrée par l'installeur, liée au dossier.
          $identity = Get-AppxPackage -Name "SpaceNotch.Identity"
          if (-not $identity) { throw "Paquet d'identité absent après l'installation." }
          Write-Host "Identité : $($identity.PackageFullName) — emplacement externe : $($identity.InstallLocation)"

          # Régression v1.13.1 : le Setup doit encore démarrer quand l'identité
          # SpaceNotch.Identity est déjà enregistrée, comme sur un poste en mise à jour.
          $log = Join-Path $env:LOCALAPPDATA "SpaceNotch\logs\spacenotch.log"
          Get-Process SpaceNotch -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          Remove-Item $log -ErrorAction SilentlyContinue
          $updateSetup = Start-Process -FilePath $setup -PassThru
          Start-Sleep -Seconds 12
          $setupAlive = -not $updateSetup.HasExited
          if ($setupAlive) { Stop-Process -Id $updateSetup.Id -Force }
          Start-Sleep -Seconds 1
          $setupJournal = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if (-not $setupAlive -or $setupJournal -match "\[FATAL\]" -or $setupJournal -notmatch "Installeur ouvert") {
            Write-Host $setupJournal
            throw "Le Setup ne démarre pas avec une identité existante."
          }
          Write-Host "Le Setup démarre malgré l'identité SpaceNotch déjà enregistrée."

          $entry = Get-ItemProperty $key
          Write-Host "Paramètres › Applications : $($entry.DisplayName) $($entry.DisplayVersion) — $($entry.UninstallString)"
          if ($entry.DisplayVersion -ne "${{ steps.version.outputs.value }}") { throw "Version inscrite inattendue : $($entry.DisplayVersion)." }

          $installedSetup = Join-Path $dir "SpaceNotch-Setup.exe"
          if (-not (Test-Path $installedSetup)) { throw "SpaceNotch-Setup.exe absent du dossier d'installation." }
          $installedSetupHash = (Get-FileHash $installedSetup).Hash
          $releaseSetupHash = (Get-FileHash $setup).Hash
          if ($installedSetupHash -ne $releaseSetupHash) { throw "Le Setup sans identité installé ne correspond pas à celui de la release." }
          if ($entry.UninstallString -ne "`"$installedSetup`" --uninstall") { throw "Désinstalleur Windows inattendu : $($entry.UninstallString)." }
          if ($entry.QuietUninstallString -ne "`"$installedSetup`" --uninstall --quiet") { throw "Désinstalleur silencieux inattendu : $($entry.QuietUninstallString)." }

          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").SpaceNotch
          if ($run -ne "`"$exe`" --startup") { throw "Lancement au démarrage inattendu : $run." }

          # La notch installée tourne avec son identité : elle doit s'ouvrir comme
          # la portable, et le dire au journal. Bloquant : une identité qui casse
          # le chargement XAML ne doit jamais être publiée.
          Get-Process SpaceNotch -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          $log = Join-Path $env:LOCALAPPDATA "SpaceNotch\logs\spacenotch.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 12
          $journal = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if ($app.HasExited -or $journal -match "\[FATAL\]" -or $journal -notmatch "window activated") {
            Write-Host $journal
            throw "La notch installée ne s'est pas ouverte (identité de paquet)."
          }
          if ($journal -notmatch "Identité de paquet : présente") {
            Write-Host $journal
            throw "La notch installée tourne sans identité de paquet."
          }
          Write-Host "La notch installée tourne avec son identité après 12 s."

          # La désinstallation ferme elle-même la notch en cours.
          $uninstall = Start-Process -FilePath $installedSetup -ArgumentList "--uninstall","--quiet" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Désinstallation silencieuse : code $($uninstall.ExitCode)." }

          # Le dossier est effacé par l'interpréteur de commandes, après la sortie.
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) {
            # Dire ce qui retient le dossier : fichiers restants, processus qui
            # en chargent un module, fenêtres ouvertes (une invite de Windows).
            Write-Host "Fichiers restants :"
            Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "Processus qui utilisent le dossier :"
            Get-Process | Where-Object {
              try { $_.Path -like "$dir*" -or ($_.Modules | Where-Object { $_.FileName -like "$dir*" }) } catch { $false }
            } | ForEach-Object { Write-Host "  $($_.Id) $($_.ProcessName) $($_.Path)" }
            Write-Host "Fenêtres ouvertes :"
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host "  $($_.Id) $($_.ProcessName) « $($_.MainWindowTitle) »" }
            throw "Le dossier d'installation est resté."
          }
          if (Test-Path $key) { throw "L'entrée de Paramètres › Applications est restée." }
          if (Get-AppxPackage -Name "SpaceNotch.Identity") { throw "Le paquet d'identité est resté." }
          if (Test-Path $menu) { throw "Le raccourci du menu Démarrer est resté." }
          if (Test-Path $desktop) { throw "Le raccourci du bureau est resté." }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").SpaceNotch) { throw "Le lancement au démarrage est resté." }
          Write-Host "Installation et désinstallation propres."

      - name: Conserver le journal de démarrage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journaux-demarrage
          path: ~/AppData/Local/SpaceNotch/logs
          if-no-files-found: ignore

      - name: Conserver SpaceNotch.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpaceNotch-${{ steps.version.outputs.value }}-exe
          path: ${{ runner.temp }}/dist/SpaceNotch.exe
          if-no-files-found: error

      - name: Conserver l'installeur et son application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpaceNotch-${{ steps.version.outputs.value }}-setup
          path: |
            ${{ runner.temp }}/dist/SpaceNotch-Setup.exe
            ${{ runner.temp }}/dist/SpaceNotch.exe
          if-no-files-found: error

      - name: Conserver le dossier zippé
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpaceNotch-${{ steps.version.outputs.value }}-zip
          path: ${{ runner.temp }}/dist/SpaceNotch-win-x64.zip
          if-no-files-found: error

      # Deux chemins vers une Release : pousser un tag v*, ou cocher « publish » sur le
      # bouton manuel — le tag v<version> est alors créé sur le commit construit.
      - name: Conserver les empreintes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpaceNotch-${{ steps.version.outputs.value }}-checksums
          path: ${{ runner.temp }}/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Créer la Release
        if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: SpaceNotch v${{ steps.version.outputs.value }}
          generate_release_notes: true
          body: |
            **Télécharger ensemble** : `SpaceNotch-Setup.exe` (l'installeur) et
            `SpaceNotch.exe` (l'application à installer). Gardez les deux fichiers
            dans le même dossier, puis lancez le Setup. `SpaceNotch-win-x64.zip`
            contient également le dossier complet.

            Windows 11 x64. L'application n'est pas signée : au premier lancement,
            SmartScreen peut afficher « Windows a protégé votre ordinateur » —
            *Informations complémentaires* › *Exécuter quand même*.

            Démonstration : `SpaceNotch.exe --demo`.
          files: |
            ${{ runner.temp }}/dist/SpaceNotch-Setup.exe
            ${{ runner.temp }}/dist/SpaceNotch.exe
            ${{ runner.temp }}/dist/SpaceNotch-win-x64.zip
