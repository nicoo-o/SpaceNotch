name: Release

# Produit SpaceNotch pour Windows, en trois formes :
#   - SpaceNotch-Setup.exe, l'installeur : la notch elle-même, qui s'ouvre sur ses choix
#     (ADR-022). C'est le même exécutable que la version portable, renommé : son nom
#     suffit à le faire démarrer en installeur ;
#   - SpaceNotch.exe, l'exécutable unique et portable — double-cliquer, rien à installer ;
#   - SpaceNotch-win-x64.zip, le dossier complet (démarrage un peu plus rapide).
#
# Deux déclencheurs :
#   - le bouton « Run workflow » de l'onglet Actions : les fichiers arrivent dans les
#     « Artifacts » de l'exécution ;
#   - un tag de version (v1.0.0…) : une Release GitHub est créée avec les fichiers attachés.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version inscrit dans l'exécutable (ex. 1.0.0)"
        required: false
        default: "1.1.0"
      publish:
        description: "Publier une Release GitHub (crée le tag v<version> sur ce commit)"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: src/SpaceNotch.App/SpaceNotch.App.csproj

jobs:
  build:
    name: Construire SpaceNotch (win-x64)
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # La version vient du tag (v1.2.3 → 1.2.3) ou du champ du bouton manuel.
      - name: Déterminer la version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ github.event.inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.0" }
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $version"

      # Les tests passent avant toute publication : un .exe qui sortirait d'un cœur
      # cassé ne mérite pas d'être distribué.
      - name: Tester
        run: dotnet test tests/SpaceNotch.Core.Tests -c Release

      # Exécutable unique. Les réglages viennent de Microsoft pour une application
      # WinUI 3 non empaquetée :
      #   - WindowsAppSDKSelfContained + SelfContained : aucun runtime à installer ;
      #   - EnableMsixTooling=true : sans lui, le fichier de ressources n'est pas
      #     renommé en resources.pri et l'application publiée plante au démarrage
      #     (WindowsAppSDK#3718) — même pour une application non empaquetée ;
      #   - IncludeAllContentForSelfExtract + IncludeNativeLibrariesForSelfExtract :
      #     les ressources et les bibliothèques natives vont dans l'exécutable et sont
      #     extraites au premier lancement ;
      #   - EnableCompressionInSingleFile : le contenu est compressé dans l'exécutable,
      #     qui pèse bien moins lourd à télécharger. Il est de toute façon extrait au
      #     premier lancement : la décompression ne coûte qu'une fois.
      - name: Publier l'exécutable unique
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -p:Platform=x64 -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.value }}
          --output "${{ runner.temp }}/single"

      - name: Publier le dossier complet
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -p:Platform=x64 -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.version.outputs.value }}
          --output "${{ runner.temp }}/folder"

      - name: Rassembler les fichiers
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}/dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Get-ChildItem "${{ runner.temp }}/single" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Aucun exécutable produit par la publication unique." }
          Copy-Item $exe.FullName "$out/SpaceNotch.exe"
          # L'installeur est le même fichier : « Setup » dans le nom suffit.
          Copy-Item $exe.FullName "$out/SpaceNotch-Setup.exe"

          Compress-Archive -Path "${{ runner.temp }}/folder/*" -DestinationPath "$out/SpaceNotch-win-x64.zip" -Force

          Get-ChildItem $out | ForEach-Object { "{0,-28} {1,8:N1} Mo" -f $_.Name, ($_.Length / 1MB) }

      # Essai de démarrage : l'exécutable unique est lancé en mode démonstration et doit
      # encore tourner après quelques secondes. Un plantage au démarrage — ressources
      # manquantes, runtime absent — se voit ici plutôt que chez l'utilisateur. Les
      # agents GitHub ont une session de bureau, mais pas toujours d'accélération
      # graphique : un échec est signalé sans bloquer la publication, journal joint.
      - name: Essai de démarrage
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "${{ runner.temp }}/dist/SpaceNotch.exe" -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            Write-Host "::warning::SpaceNotch.exe s'est arrêté au démarrage (code $($process.ExitCode)). Voir l'artefact journaux-demarrage."
            exit 1
          }
          Write-Host "SpaceNotch.exe tourne toujours après 12 s."
          Stop-Process -Id $process.Id -Force

      # Essai de l'installeur avec sa fenêtre : c'est ce que lance un double-clic.
      # La fenêtre doit encore être là après quelques secondes, sans avoir rien
      # installé (personne ne clique). En cas d'échec : journal de l'application
      # et erreurs .NET du journal d'événements de Windows.
      - name: Essai de l'installeur (fenêtre)
        shell: pwsh
        run: |
          $setup = "${{ runner.temp }}/dist/SpaceNotch-Setup.exe"
          $log = Join-Path $env:LOCALAPPDATA "SpaceNotch\logs\spacenotch.log"
          $process = Start-Process -FilePath $setup -PassThru
          Start-Sleep -Seconds 12
          $alive = -not $process.HasExited
          if ($alive) { Stop-Process -Id $process.Id -Force }

          if (Test-Path $log) {
            Write-Host "----- journal -----"
            Get-Content $log -Tail 60
          }

          if (-not $alive) {
            Write-Host "----- journal d'événements -----"
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @(".NET Runtime", "Application Error", "Windows Error Reporting") } |
              ForEach-Object { $_.Message } | Select-Object -First 6
            throw "L'installeur s'est fermé au démarrage (code $($process.ExitCode))."
          }
          Write-Host "La fenêtre de l'installeur est toujours ouverte après 12 s."

      # Essai de l'installeur, de bout en bout, en mode silencieux : installer pour
      # l'utilisateur, vérifier fichier, raccourcis et entrée de Paramètres ›
      # Applications, lancer la notch installée, puis désinstaller et vérifier que
      # rien ne reste. Un installeur cassé ne doit jamais être publié.
      - name: Essai de l'installeur
        shell: pwsh
        run: |
          $setup = "${{ runner.temp }}/dist/SpaceNotch-Setup.exe"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\SpaceNotch"
          $exe = Join-Path $dir "SpaceNotch.exe"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SpaceNotch"
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "SpaceNotch.lnk"
          $desktop = Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "SpaceNotch.lnk"

          $install = Start-Process -FilePath $setup -ArgumentList "--quiet","--startup=on","--desktop=on" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installation silencieuse : code $($install.ExitCode)." }
          if (-not (Test-Path $exe)) { throw "SpaceNotch.exe absent de $dir." }
          if (-not (Test-Path $menu)) { throw "Raccourci du menu Démarrer absent." }
          if (-not (Test-Path $desktop)) { throw "Raccourci du bureau absent." }

          $entry = Get-ItemProperty $key
          Write-Host "Paramètres › Applications : $($entry.DisplayName) $($entry.DisplayVersion) — $($entry.UninstallString)"
          if ($entry.DisplayVersion -ne "${{ steps.version.outputs.value }}") { throw "Version inscrite inattendue : $($entry.DisplayVersion)." }

          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").SpaceNotch
          if ($run -ne "`"$exe`" --startup") { throw "Lancement au démarrage inattendu : $run." }

          $app = Start-Process -FilePath $exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) {
            Write-Host "::warning::La notch installée s'est arrêtée au démarrage (code $($app.ExitCode))."
          } else {
            Write-Host "La notch installée tourne toujours après 12 s."
          }

          # La désinstallation ferme elle-même la notch en cours.
          $uninstall = Start-Process -FilePath $exe -ArgumentList "--uninstall","--quiet" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Désinstallation silencieuse : code $($uninstall.ExitCode)." }

          # Le dossier est effacé par l'interpréteur de commandes, après la sortie.
          for ($i = 0; $i -lt 20 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { throw "Le dossier d'installation est resté." }
          if (Test-Path $key) { throw "L'entrée de Paramètres › Applications est restée." }
          if (Test-Path $menu) { throw "Le raccourci du menu Démarrer est resté." }
          if (Test-Path $desktop) { throw "Le raccourci du bureau est resté." }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").SpaceNotch) { throw "Le lancement au démarrage est resté." }
          Write-Host "Installation et désinstallation propres."

      - name: Conserver le journal de démarrage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-demarrage
          path: ~/AppData/Local/SpaceNotch/logs
          if-no-files-found: ignore

      - name: Conserver SpaceNotch.exe
        uses: actions/upload-artifact@v4
        with:
          name: SpaceNotch-${{ steps.version.outputs.value }}-exe
          path: ${{ runner.temp }}/dist/SpaceNotch.exe
          if-no-files-found: error

      - name: Conserver l'installeur
        uses: actions/upload-artifact@v4
        with:
          name: SpaceNotch-${{ steps.version.outputs.value }}-setup
          path: ${{ runner.temp }}/dist/SpaceNotch-Setup.exe
          if-no-files-found: error

      - name: Conserver le dossier zippé
        uses: actions/upload-artifact@v4
        with:
          name: SpaceNotch-${{ steps.version.outputs.value }}-zip
          path: ${{ runner.temp }}/dist/SpaceNotch-win-x64.zip
          if-no-files-found: error

      # Deux chemins vers une Release : pousser un tag v*, ou cocher « publish » sur le
      # bouton manuel — le tag v<version> est alors créé sur le commit construit.
      - name: Créer la Release
        if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: SpaceNotch v${{ steps.version.outputs.value }}
          generate_release_notes: true
          body: |
            **Télécharger** : `SpaceNotch-Setup.exe` (l'installeur — la notch s'ouvre sur
            ses choix), `SpaceNotch.exe` (portable, rien à installer) ou
            `SpaceNotch-win-x64.zip` (dossier complet).

            Windows 11 x64. L'application n'est pas signée : au premier lancement,
            SmartScreen peut afficher « Windows a protégé votre ordinateur » —
            *Informations complémentaires* › *Exécuter quand même*.

            Démonstration : `SpaceNotch.exe --demo`.
          files: |
            ${{ runner.temp }}/dist/SpaceNotch-Setup.exe
            ${{ runner.temp }}/dist/SpaceNotch.exe
            ${{ runner.temp }}/dist/SpaceNotch-win-x64.zip
