name: Tournage du teaser

# Filme la vraie notch sur un Windows : la démo, plus les gestes qu'elle ne fait
# pas seule (lecteur, recherche, décrochage). Les images servent au teaser du README.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "tools/teaser/footage/**"
      - ".github/workflows/teaser-footage.yml"

permissions:
  contents: read

jobs:
  film:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dernière version publiée
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo ${{ github.repository }} --pattern "SpaceNotch.exe" --dir "${{ runner.temp }}/app"

      - name: Outils
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          python -m pip install --quiet pyautogui pywin32

      - name: Tournage
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}/footage"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          python tools/teaser/footage/film.py "$out/footage.mp4" "${{ runner.temp }}/app/SpaceNotch.exe"
          $log = Join-Path $env:LOCALAPPDATA "SpaceNotch\logs\spacenotch.log"
          if (Test-Path $log) { Copy-Item $log "$out/spacenotch.log" }
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footage
          path: ${{ runner.temp }}/footage
